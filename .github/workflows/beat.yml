name: desk-beat
# ═══════════════════════════════════════════════════════════════════════════
# DESK-BEAT · R361 FLOW-IGNITION — the desk engine beats autonomously.
# ───────────────────────────────────────────────────────────────────────────
# Owner word (2026-10-15): "open all economic barriers — everything runs and
# flows". Measured before this file existed: saos-desk had ZERO workflows
# (Actions runs: 0) — the engine (202/202 selftest, real-bars beats) never
# ran on its own; state/beat.json froze at beat 9. This workflow = the pulse:
#   1. selftest gate (fail-closed — 202/202 or red run)
#   2. one beat per universe symbol on REAL bars (beat-live.mjs, zero keys,
#      public GET only — mandate.ingest.publicEndpointsOnly law)
#   3. state commit — honest verdicts always land (land law, same as arteries)
# Cadence: every 2h at :23 (off-peak). Failures are honest: a dead symbol
# logs NO-REAL-BARS and the run continues; the state commit always lands.
# ═══════════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desk-beat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: selftest gate (fail-closed — red run = public alarm)
        run: bun selftest.mjs

      - name: desk beats on REAL bars (one per universe symbol)
        run: |
          mkdir -p receipts
          FAILS=0
          for s in LEUMI.TA FIBI.TA POLI.TA NICE.TA TEVA.TA ICL.TA ESLT.TA BEZQ.TA MZTF.TA DSEA.TA SPY QQQ BTC-USD; do
            echo "--- beat $s"
            if bun src/beat-live.mjs "$s" > "receipts/beat-$(echo "$s" | tr './' '__').json" 2>&1; then
              echo "beat $s landed"
            else
              echo "beat $s honest-fail (NO-REAL-BARS or gate — logged, run continues)"
              FAILS=$((FAILS+1))
            fi
          done
          echo "beats done · honest-fails: $FAILS"

      - name: commit state + receipts (honest verdicts always land, FAIL included)
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add state receipts
          if git diff --cached --quiet; then
            echo "no state change this round (honest)"
          else
            git commit -m "desk-beat: state @ $(date -u +%FT%TZ) (real bars · honest verdicts · live-armed mandate R361)"
            git pull --rebase origin main || true
            git push origin main || echo "push failed this round (honest — next beat retries on fresh checkout)"
          fi
